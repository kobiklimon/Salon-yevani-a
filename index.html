<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סלון יווני - ניהול הופעות וסניפים</title>
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogI9eo15DXqSAtINeh15z115Ug16nXldeg15kiLAogICJzaG9ydF9uYW1lIjogI9eo15DXqSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWExYTFhIiwKICAidGhlbWVfY29sb3IiOiAiI2Q0YWYzNyIKfQ==">
    <meta name="theme-color" content="#d4af37">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --danger: #e53935;
            --success: #43a047;
            --border-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); direction: rtl; padding-bottom: 40px; }

        header { background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent-gold); position: sticky; top: 0; z-index: 100; }
        header h1 { color: var(--accent-gold); font-size: 1.4rem; }

        .container { max-width: 700px; margin: 0 auto; padding: 12px; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; position: relative; }
        .tab-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        
        input, select, button, textarea { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 0.95rem; }
        button { background-color: var(--accent-gold); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-secondary { background-color: #444; color: white; }
        .btn-edit { background-color: #fb8c00; color: white; }

        .hidden { display: none !important; }

        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-name { font-weight: bold; font-size: 0.8rem; color: var(--accent-gold); padding: 4px; }
        .cal-cell { background: #252525; border-radius: 6px; min-height: 60px; padding: 4px; font-size: 0.8rem; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border: 1px solid transparent; }
        .cal-cell:hover { border-color: var(--accent-gold); }
        .cal-cell.empty { background: transparent; cursor: default; }
        .cal-cell .day-num { font-weight: bold; text-align: right; }
        .cal-event-badge { color: #fff; border-radius: 4px; font-size: 0.65rem; padding: 2px 4px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; text-align: center; }

        .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .roster-item { display: flex; align-items: center; gap: 8px; background: #2a2a2a; padding: 8px; border-radius: 6px; }
        .roster-item input { width: auto; margin: 0; }
        .roster-item.disabled-role { opacity: 0.35; }

        .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; background: #333; color: var(--accent-gold); margin-right: 4px; }
        .notif-badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.7rem; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, getDoc, doc, setDoc, updateDoc, query, where, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCis-H1d8436iH6vBkNfGWoy3ekkIDSflU",
            authDomain: "salon-yevani-a.firebaseapp.com",
            projectId: "salon-yevani-a",
            storageBucket: "salon-yevani-a.firebasestorage.app",
            messagingSenderId: "659584308438",
            appId: "1:659584308438:web:7ee8f7bc62e1b2132c6577"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentBranchId = '';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let allMusicians = [];
        let allBranches = [];
        let monthEvents = [];
        let isAdmin = false;

        const defaultColors = ['#d4af37', '#1e88e5', '#43a047', '#e53935', '#8e24aa', '#fb8c00', '#00acc1'];

        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            
            document.getElementById(`btn-tab-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            if(tabName === 'calendar') loadCalendarView();
            if(tabName === 'admin' && isAdmin) loadAdminData();
            if(tabName === 'notifs') loadNotificationsView();
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-email').textContent = user.email;

                await checkUserAdminStatus(user);
                await loadBranchesSelect();
                await loadMusiciansData();
                listenToNotifications();
                loadCalendarView();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        async function checkUserAdminStatus(user) {
            if (user.email.toLowerCase() === "kobiklimon@gmail.com") {
                isAdmin = true;
            } else {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().role === "admin") {
                    isAdmin = true;
                } else {
                    isAdmin = false;
                }
            }

            const adminTabBtn = document.getElementById('btn-tab-admin');
            if (isAdmin) {
                adminTabBtn.classList.remove('hidden');
            } else {
                adminTabBtn.classList.add('hidden');
                switchTab('calendar');
            }
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch (err) { alert("שגיאה בהתחברות: " + err.message); }
        });

        document.getElementById('register-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if (!email || !password) {
                alert("נא להזין אימייל וסיסמה להרשמה.");
                return;
            }
            try {
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                await setDoc(doc(db, "users", userCred.user.uid), { email: email, role: "user" });
                alert("המשתמש נוצר והתחבר בהצלחה!");
            } catch (err) {
                alert("שגיאה בהרשמה: " + err.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        async function loadBranchesSelect() {
            const select = document.getElementById('branch-select');
            select.innerHTML = '<option value="">כל הסניפים (הצג הכל)</option>';
            const snap = await getDocs(collection(db, "branches"));
            allBranches = [];
            snap.forEach((d, idx) => {
                const bData = d.data();
                if (!bData.color) {
                    bData.color = defaultColors[idx % defaultColors.length];
                }
                allBranches.push({ id: d.id, ...bData });
                select.innerHTML += `<option value="${d.id}">${bData.name}</option>`;
            });
        }

        document.getElementById('add-branch-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;
            const editId = document.getElementById('edit-branch-id').value;
            const name = document.getElementById('new-branch-name').value;
            const managerName = document.getElementById('new-branch-manager').value;
            const managerPhone = document.getElementById('new-branch-phone').value;
            const color = document.getElementById('new-branch-color').value;

            if (!managerName || !managerPhone) {
                alert("חובה להגדיר מנהל סניף ומספר טלפון לכל סניף!");
                return;
            }

            try {
                if (editId) {
                    await updateDoc(doc(db, "branches", editId), { name, managerName, managerPhone, color });
                    document.getElementById('edit-branch-id').value = '';
                    document.getElementById('branch-submit-btn').textContent = 'הוסף סניף';
                    alert("הסניף עודכן בהצלחה!");
                } else {
                    await addDoc(collection(db, "branches"), { name, managerName, managerPhone, color });
                    alert("סניף חדש נוסף בהצלחה!");
                }
                document.getElementById('new-branch-name').value = '';
                document.getElementById('new-branch-manager').value = '';
                document.getElementById('new-branch-phone').value = '';
                loadBranchesSelect();
                loadAdminData();
            } catch (err) {
                alert("שגיאה בשמירת סניף: " + err.message);
            }
        });

        document.getElementById('add-musician-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;
            const editId = document.getElementById('edit-musician-id').value;
            const name = document.getElementById('musician-name').value;
            const role = document.getElementById('musician-role').value;
            const email = document.getElementById('musician-email').value.trim().toLowerCase();
            const phone = document.getElementById('musician-phone').value.trim();

            try {
                if (editId) {
                    await updateDoc(doc(db, "musicians", editId), { name, role, email, phone });
                    document.getElementById('edit-musician-id').value = '';
                    document.getElementById('musician-submit-btn').textContent = 'הוסף איש צוות';
                    alert("איש הצוות עודכן בהצלחה!");
                } else {
                    await addDoc(collection(db, "musicians"), { name, role, email, phone });
                    alert("איש צוות נוסף בהצלחה!");
                }

                document.getElementById('musician-name').value = '';
                document.getElementById('musician-email').value = '';
                document.getElementById('musician-phone').value = '';
                await loadMusiciansData();
                loadAdminData();
            } catch (err) {
                alert("שגיאה בשמירת איש צוות: " + err.message);
            }
        });

        async function loadMusiciansData() {
            const snap = await getDocs(collection(db, "musicians"));
            allMusicians = [];
            snap.forEach(d => allMusicians.push({ id: d.id, ...d.data() }));
        }

        async function loadAdminData() {
            if(!isAdmin) return;
            const bSnap = await getDocs(collection(db, "branches"));
            const bList = document.getElementById('branches-list');
            bList.innerHTML = '<h4>סניפים קיימים ומנהלים:</h4>';
            bSnap.forEach(d => {
                const data = d.data();
                bList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0; background:#252525; padding:8px; border-radius:6px; border-right:4px solid ${data.color || '#d4af37'};">
                    <span>📍 <strong>${data.name}</strong><br><small style="color:var(--text-muted);">👤 מנהל סניף: ${data.managerName || 'לא הוגדר'} | 📱 ${data.managerPhone || ''}</small></span>
                    <div style="display:flex; gap:5px;">
                        <button type="button" class="btn-edit" style="width:auto; padding:2px 8px;" onclick="editBranch('${d.id}', '${data.name}', '${data.managerName || ''}', '${data.managerPhone || ''}', '${data.color || '#d4af37'}')">ערוך</button>
                        <button type="button" class="btn-danger" style="width:auto; padding:2px 8px;" onclick="deleteItem('branches', '${d.id}')">מחק</button>
                    </div>
                </div>`;
            });

            const mList = document.getElementById('musicians-list');
            mList.innerHTML = '<h4 style="margin-top:10px;">צוות נגנים וזמרים:</h4>';
            allMusicians.forEach(m => {
                mList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0; background:#252525; padding:8px; border-radius:6px;">
                    <span>🎵 ${m.name} (${m.role})<br><small style="color:var(--text-muted);">📧 ${m.email || 'אין אימייל'} | 📱 ${m.phone || 'אין טלפון'}</small></span>
                    <div style="display:flex; gap:5px;">
                        <button type="button" class="btn-edit" style="width:auto; padding:2px 8px;" onclick="editMusician('${m.id}', '${m.name}', '${m.role}', '${m.email || ''}', '${m.phone || ''}')">ערוך</button>
                        <button type="button" class="btn-danger" style="width:auto; padding:2px 8px;" onclick="deleteItem('musicians', '${m.id}')">מחק</button>
                    </div>
                </div>`;
            });
        }

        window.editBranch = (id, name, managerName, managerPhone, color) => {
            document.getElementById('edit-branch-id').value = id;
            document.getElementById('new-branch-name').value = name;
            document.getElementById('new-branch-manager').value = managerName;
            document.getElementById('new-branch-phone').value = managerPhone;
            document.getElementById('new-branch-color').value = color || '#d4af37';
            document.getElementById('branch-submit-btn').textContent = 'עדכן סניף';
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.editMusician = (id, name, role, email, phone) => {
            document.getElementById('edit-musician-id').value = id;
            document.getElementById('musician-name').value = name;
            document.getElementById('musician-role').value = role;
            document.getElementById('musician-email').value = email;
            document.getElementById('musician-phone').value = phone;
            document.getElementById('musician-submit-btn').textContent = 'עדכן איש צוות';
            window.scrollTo({top: 250, behavior: 'smooth'});
        };

        window.deleteItem = async (col, id) => {
            if(!isAdmin) return;
            if(confirm("למחוק פריט זה?")) {
                await deleteDoc(doc(db, col, id));
                await loadMusiciansData();
                loadAdminData();
                loadBranchesSelect();
                loadCalendarView();
            }
        };

        document.getElementById('branch-select').addEventListener('change', (e) => {
            currentBranchId = e.target.value;
            loadCalendarView();
        });

        window.changeMonth = (dir) => {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            loadCalendarView();
        };
        async function loadCalendarView() {
            const container = document.getElementById('calendar-container');
            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
            
            let q;
            if (currentBranchId) {
                q = query(collection(db, "events"), where("branchId", "==", currentBranchId));
            } else {
                q = collection(db, "events");
            }
            const snap = await getDocs(q);
            
            const userEmail = auth.currentUser ? auth.currentUser.email.toLowerCase() : '';
            const matchedMusician = allMusicians.find(m => m.email && m.email.toLowerCase() === userEmail);

            monthEvents = [];
            snap.forEach(d => {
                const eventData = d.data();
                if (isAdmin) {
                    monthEvents.push({ id: d.id, ...eventData });
                } else {
                    const isUserAssigned = eventData.assignedStaff && eventData.assignedStaff.some(staffStr => {
                        const lowerStaff = staffStr.toLowerCase();
                        if (matchedMusician && lowerStaff.includes(matchedMusician.name.toLowerCase())) {
                            return true;
                        }
                        return lowerStaff.includes(userEmail);
                    });
                    if (isUserAssigned) {
                        monthEvents.push({ id: d.id, ...eventData });
                    }
                }
            });

            container.innerHTML = `
                <div class="calendar-header">
                    <button onclick="changeMonth(-1)" class="btn-secondary" style="width:auto; padding:5px 12px;">◀ חודש קודם</button>
                    <h3 id="cal-month-title" style="color:var(--accent-gold);">${monthNames[currentMonth]} ${currentYear}</h3>
                    <button onclick="changeMonth(1)" class="btn-secondary" style="width:auto; padding:5px 12px;">חודש הבא ▶</button>
                </div>
                <div id="calendar-grid" class="calendar-grid"></div>
            `;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            let gridHTML = `
                <div class="cal-day-name">א'</div><div class="cal-day-name">ב'</div>
                <div class="cal-day-name">ג'</div><div class="cal-day-name">ד'</div>
                <div class="cal-day-name">ה'</div><div class="cal-day-name">ו'</div>
                <div class="cal-day-name">ש'</div>
            `;

            for (let i = 0; i < firstDay; i++) {
                gridHTML += `<div class="cal-cell empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = monthEvents.filter(e => e.date === dateStr);

                let eventBadges = dayEvents.map(e => {
                    const branch = allBranches.find(b => b.id === e.branchId);
                    const bName = branch ? branch.name : '';
                    const bColor = branch ? (branch.color || '#d4af37') : '#d4af37';
                    return `<div class="cal-event-badge" style="background-color:${bColor};">${e.time} ${bName ? `- ${bName}` : ''}</div>`;
                }).join('');

                const canClick = isAdmin || dayEvents.length > 0;
                const clickAttr = canClick ? `onclick="openDayModal('${dateStr}')"` : '';

                gridHTML += `
                    <div class="cal-cell" ${clickAttr} style="${!canClick ? 'opacity:0.4; cursor:default;' : ''}">
                        <div class="day-num">${day}</div>
                        <div>${eventBadges}</div>
                    </div>
                `;
            }

            document.getElementById('calendar-grid').innerHTML = gridHTML;
        }

        window.openDayModal = (dateStr) => {
            document.getElementById('event-date-input').value = dateStr;
            document.getElementById('event-time-input').value = "20:00";
            document.getElementById('modal-date-title').textContent = `הופעות/שיבוצים לתאריך: ${dateStr}`;
            
            const rosterContainer = document.getElementById('musicians-roster');
            rosterContainer.innerHTML = '';
            
            if (!isAdmin || !currentBranchId) {
                document.getElementById('save-event-form').classList.add('hidden');
            } else {
                document.getElementById('save-event-form').classList.remove('hidden');
                if (allMusicians.length === 0) {
                    rosterContainer.innerHTML = '<p style="color:var(--text-muted);">אין נגנים/זמרים במערכת. הגדר אותם בלשונית "תפריט מנהל".</p>';
                } else {
                    allMusicians.forEach(m => {
                        rosterContainer.innerHTML += `
                            <div class="roster-item" id="item-m-${m.id}">
                                <input type="checkbox" class="musician-checkbox" id="m-${m.id}" data-role="${m.role}" data-name="${m.name}" value="${m.name} (${m.role})" onchange="updateRoleDisabling()">
                                <label for="m-${m.id}">${m.name} <span class="badge">${m.role}</span></label>
                            </div>
                        `;
                    });
                }
            }

            renderExistingEvents(dateStr);
            document.getElementById('event-modal').classList.remove('hidden');
        };

        window.updateRoleDisabling = () => {
            const selectedRoles = [];
            document.querySelectorAll('.musician-checkbox:checked').forEach(cb => {
                selectedRoles.push(cb.getAttribute('data-role'));
            });

            document.querySelectorAll('.musician-checkbox').forEach(cb => {
                const role = cb.getAttribute('data-role');
                const parentDiv = document.getElementById(`item-${cb.id}`);
                
                if (!cb.checked && selectedRoles.includes(role)) {
                    cb.disabled = true;
                    if(parentDiv) parentDiv.classList.add('disabled-role');
                } else {
                    cb.disabled = false;
                    if(parentDiv) parentDiv.classList.remove('disabled-role');
                }
            });
        };

        function renderExistingEvents(dateStr) {
            const existingList = document.getElementById('existing-day-events');
            const dayEvents = monthEvents.filter(e => e.date === dateStr);
            if(dayEvents.length === 0) {
                existingList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">אין הופעות שנקבעו ליום זה.</p>';
                return;
            }

            const userEmail = auth.currentUser ? auth.currentUser.email.toLowerCase() : '';
            const matchedMusician = allMusicians.find(m => m.email && m.email.toLowerCase() === userEmail);

            existingList.innerHTML = dayEvents.map(e => {
                const branch = allBranches.find(b => b.id === e.branchId);
                const bName = branch ? branch.name : 'סניף';
                const bColor = branch ? (branch.color || '#d4af37') : '#d4af37';

                const isUserInEvent = !isAdmin && e.assignedStaff && e.assignedStaff.some(s => {
                    const lower = s.toLowerCase();
                    return lower.includes(userEmail) || (matchedMusician && lower.includes(matchedMusician.name.toLowerCase()));
                });

                return `
                <div style="background:#2a2a2a; padding:10px; margin-top:8px; border-radius:6px; font-size:0.85rem; border-right:4px solid ${bColor};">
                    <strong>📍 ${bName} | 🕒 שעת הופעה: ${e.time}</strong><br>
                    <div style="margin-top:5px;"><strong>👥 ההרכב המלא להופעה זו:</strong></div>
                    <div style="color:var(--accent-gold); margin-top:3px;">${e.assignedStaff ? e.assignedStaff.join('<br>') : 'לא שובצו'}</div>
                    ${isAdmin ? `<button type="button" class="btn-danger" style="width:auto; padding:2px 8px; margin-top:8px;" onclick="deleteShow('${e.id}', '${dateStr}')">מחק הופעה</button>` : ''}
                    ${isUserInEvent ? `<button type="button" class="btn-danger" style="width:100%; margin-top:10px;" onclick="requestCancellation('${e.id}', '${e.date}', '${e.time}', '${e.branchId}')">🚨 בקש ביטול הופעה</button>` : ''}
                </div>
            `;}).join('');
        }

        window.requestCancellation = async (eventId, eventDate, eventTime, branchId) => {
            if (!confirm("האם אתה בטוח שברצונך לשלוח בקשת ביטול להופעה זו?")) return;

            const userEmail = auth.currentUser ? auth.currentUser.email : '';
            const musician = allMusicians.find(m => m.email && m.email.toLowerCase() === userEmail.toLowerCase());
            const musicianName = musician ? musician.name : userEmail;
            const branchObj = allBranches.find(b => b.id === branchId);
            const branchName = branchObj ? branchObj.name : 'סניף';

            await addDoc(collection(db, "cancellation_requests"), {
                eventId,
                eventDate,
                eventTime,
                branchId,
                branchName,
                musicianName,
                musicianEmail: userEmail,
                status: "pending",
                createdAt: new Date()
            });

            alert("בקשת הביטול נשלחה בהצלחה למנהל המערכת ולמנהל הסניף!");
            closeModal();
        };

        function listenToNotifications() {
            const q = collection(db, "cancellation_requests");
            onSnapshot(q, (snapshot) => {
                let pendingCount = 0;
                const userEmail = auth.currentUser ? auth.currentUser.email.toLowerCase() : '';

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if (isAdmin && data.status === "pending") {
                        pendingCount++;
                    } else if (!isAdmin && data.musicianEmail.toLowerCase() === userEmail) {
                        if (data.status === "approved" || data.status === "rejected") {
                            pendingCount++;
                        }
                    }
                });

                const badge = document.getElementById('notif-count-badge');
                if (pendingCount > 0) {
                    badge.textContent = pendingCount;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            });
        }
        async function loadNotificationsView() {
            const container = document.getElementById('notifs-container');
            const userEmail = auth.currentUser ? auth.currentUser.email.toLowerCase() : '';
            const snap = await getDocs(collection(db, "cancellation_requests"));

            let html = '<h3 style="color:var(--accent-gold); margin-bottom:12px;">🔔 התראות ובקשות ביטול</h3>';

            let count = 0;
            const allRequests = [];
            snap.forEach(d => allRequests.push({ id: d.id, ...d.data() }));

            for (const req of allRequests) {
                if (isAdmin) {
                    count++;
                    const statusText = req.status === 'pending' ? '⏳ ממתין לאישור מנהל' : (req.status === 'approved' ? '✅ אושר' : '❌ נדחה');
                    
                    let replacementDropdown = '';
                    if (req.status === 'pending') {
                        const availables = await findAvailableMusiciansForRole(req.eventDate, req.eventTime, req.musicianName);
                        if (availables.length === 0) {
                            replacementDropdown = `<p style="color:var(--danger); font-size:0.8rem; margin-top:8px;">⚠️ אין נגנים/זמרים פנויים בתפקיד זה בתאריך ובשעה זו!</p>`;
                        } else {
                            replacementDropdown = `
                                <label style="font-size:0.8rem; margin-top:8px; display:block;">בחר נגן/זמר חלופי פנוי (מאותו תפקיד):</label>
                                <select id="replacement-select-${req.id}" style="margin-top:4px; margin-bottom:8px;">
                                    ${availables.map(m => `<option value="${m.name}">${m.name} (${m.role})</option>`).join('')}
                                </select>
                            `;
                        }
                    }

                    const branch = allBranches.find(b => b.id === req.branchId);

                    html += `
                        <div style="background:#252525; padding:12px; margin-bottom:10px; border-radius:8px; border-right:4px solid ${req.status === 'pending' ? '#fb8c00' : (req.status === 'approved' ? 'var(--success)' : 'var(--danger)')};">
                            <strong>📍 סניף: ${req.branchName}</strong> | 📅 תאריך: ${req.eventDate} (${req.eventTime})<br>
                            <small style="color:var(--text-muted);">👤 מנהל סניף לעדכון: ${branch ? branch.managerName : 'לא הוגדר'}</small><br>
                            <strong>👤 מבוקש על ידי:</strong> ${req.musicianName} (${req.musicianEmail})<br>
                            <div style="margin-top:6px;">סטטוס: <strong>${statusText}</strong></div>
                            ${req.status === 'pending' ? `
                                ${replacementDropdown}
                                <div style="display:flex; gap:8px; margin-top:10px;">
                                    <button class="btn-success" style="padding:6px;" onclick="approveRequest('${req.id}', '${req.eventId}', '${req.musicianName}', '${req.branchId}')">אישור ביטול והחלפה</button>
                                    <button class="btn-danger" style="padding:6px;" onclick="rejectRequest('${req.id}')">דחיית בקשה</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                } else if (req.musicianEmail.toLowerCase() === userEmail) {
                    count++;
                    const statusText = req.status === 'pending' ? '⏳ הבקשה שלך ממתינה לאישור מנהל' : (req.status === 'approved' ? '✅ הבקשה אושרה והוסרת מההופעה' : '❌ הבקשה נדחתה על ידי המנהל');
                    html += `
                        <div style="background:#252525; padding:12px; margin-bottom:10px; border-radius:8px; border-right:4px solid ${req.status === 'pending' ? '#fb8c00' : (req.status === 'approved' ? 'var(--success)' : 'var(--danger)')};">
                            <strong>📍 סניף: ${req.branchName}</strong> | 📅 תאריך: ${req.eventDate}<br>
                            <div style="margin-top:6px;"><strong>${statusText}</strong></div>
                        </div>
                    `;
                }
            }

            if (count === 0) {
                html += '<p style="color:var(--text-muted);">אין התראות או בקשות פתוחות כרגע.</p>';
            }

            container.innerHTML = html;
        }

        async function findAvailableMusiciansForRole(eventDate, eventTime, cancellingMusicianName) {
            const cancellingMusician = allMusicians.find(m => m.name.toLowerCase() === cancellingMusicianName.toLowerCase());
            const roleNeeded = cancellingMusician ? cancellingMusician.role : null;

            const q = query(collection(db, "events"), where("date", "==", eventDate), where("time", "==", eventTime));
            const busySnap = await getDocs(q);

            const busyMusicianNames = [];
            busySnap.forEach(d => {
                const staffList = d.data().assignedStaff || [];
                staffList.forEach(s => {
                    allMusicians.forEach(m => {
                        if (s.toLowerCase().includes(m.name.toLowerCase())) {
                            busyMusicianNames.push(m.name.toLowerCase());
                        }
                    });
                });
            });

            return allMusicians.filter(m => {
                const sameRole = !roleNeeded || m.role === roleNeeded;
                const notCancelling = m.name.toLowerCase() !== cancellingMusicianName.toLowerCase();
                const isNotBusy = !busyMusicianNames.includes(m.name.toLowerCase());
                return sameRole && notCancelling && isNotBusy;
            });
        }

        window.approveRequest = async (requestId, eventId, cancellingMusicianName, branchId) => {
            const selectElem = document.getElementById(`replacement-select-${requestId}`);
            if (!selectElem) {
                alert("אין נגן/זמר פנוי לבחירה בתפקיד זה!");
                return;
            }

            const newMusicianName = selectElem.value;
            if (!newMusicianName) return;

            const eventRef = doc(db, "events", eventId);
            const eventDoc = await getDoc(eventRef);
            
            if (eventDoc.exists()) {
                let staff = eventDoc.data().assignedStaff || [];
                staff = staff.map(s => s.toLowerCase().includes(cancellingMusicianName.toLowerCase()) ? `${newMusicianName} (${selectElem.options[selectElem.selectedIndex].text.split('(')[1] || 'ממלא מקום'}` : s);
                await updateDoc(eventRef, { assignedStaff: staff });
            }

            const branchObj = allBranches.find(b => b.id === branchId);
            const managerName = branchObj ? branchObj.managerName : 'מנהל הסניף';

            await updateDoc(doc(db, "cancellation_requests", requestId), { status: "approved", newMusician: newMusicianName });
            alert(`הבקשה אושרה! ${newMusicianName} שובץ במקום ${cancellingMusicianName}.\nהודעה אוטומטית נשלחה ל${managerName} (מנהל הסניף).`);

            loadNotificationsView();
            loadCalendarView();
        };

        window.rejectRequest = async (requestId) => {
            await updateDoc(doc(db, "cancellation_requests", requestId), { status: "rejected" });
            alert("בקשת הביטול נדחתה.");
            loadNotificationsView();
        };

        window.deleteShow = async (id, dateStr) => {
            if(!isAdmin) return;
            if(confirm("למחוק הופעה זו?")) {
                await deleteDoc(doc(db, "events", id));
                await loadCalendarView();
                renderExistingEvents(dateStr);
            }
        };

        window.closeModal = () => document.getElementById('event-modal').classList.add('hidden');

        document.getElementById('save-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin || !currentBranchId) {
                alert("יש לבחור סניף מוגדר מראש העמוד כדי ליצור הופעה.");
                return;
            }

            const date = document.getElementById('event-date-input').value;
            const time = document.getElementById('event-time-input').value;
            
            const existingTimeConflict = monthEvents.find(ev => ev.date === date && ev.time === time);
            if (existingTimeConflict) {
                alert(`שגיאה: כבר קיימת הופעה בסניף זה בתאריך ${date} בשעה ${time}!`);
                return;
            }

            const assignedStaff = [];
            const selectedRoles = [];
            let duplicateRoleFound = false;
            let duplicateRoleName = '';

            const checkboxes = document.querySelectorAll('.musician-checkbox:checked');
            checkboxes.forEach(cb => {
                const role = cb.getAttribute('data-role');
                const name = cb.getAttribute('data-name');
                
                if (selectedRoles.includes(role)) {
                    duplicateRoleFound = true;
                    duplicateRoleName = role;
                } else {
                    selectedRoles.push(role);
                    assignedStaff.push(`${name} (${role})`);
                }
            });

            if (duplicateRoleFound) {
                alert(`שגיאה: לא ניתן לשבץ יותר מאיש צוות אחד בתפקיד "${duplicateRoleName}" באותה הופעה!`);
                return;
            }

            if(assignedStaff.length === 0) {
                alert("נא לבחור לפחות איש צוות אחד להופעה.");
                return;
            }

            await addDoc(collection(db, "events"), {
                branchId: currentBranchId,
                date,
                time,
                assignedStaff,
                createdAt: new Date()
            });

            closeModal();
            loadCalendarView();
        });

    </script>
</head>
<body>

    <header>
        <h1>🏛️ סלון יווני - ניהול הופעות וסניפים</h1>
    </header>

    <div class="container">
        
        <div id="auth-section" class="card">
            <h2 style="margin-bottom: 15px; text-align: center;">התחברות / הרשמה</h2>
            <form id="login-form" onsubmit="return false;">
                <input type="email" id="login-email" required placeholder="אימייל">
                <input type="password" id="login-password" required placeholder="סיסמה">
                <button type="submit">התחבר</button>
                <button type="button" id="register-btn" class="btn-secondary" style="margin-top:8px;">הירשם כמשתמש חדש</button>
            </form>
        </div>

        <div id="main-app" class="hidden">
            
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-size:0.85rem; color:var(--text-muted);">מחובר: <strong id="user-email"></strong></span>
                <button type="button" id="logout-btn" class="btn-danger" style="width:auto; padding:4px 10px; font-size:0.8rem;">התנתק</button>
            </div>

            <div class="card" style="padding:10px; margin-bottom:10px;">
                <label style="font-weight:bold; color:var(--accent-gold);">סינון סניף (ברירת מחדל: כל הסניפים):</label>
                <select id="branch-select" style="margin-bottom:0; margin-top:5px;"></select>
            </div>

            <div class="nav-tabs">
                <button type="button" id="btn-tab-calendar" class="tab-btn active" onclick="switchTab('calendar')">📅 יומן הופעות</button>
                <button type="button" id="btn-tab-notifs" class="tab-btn" onclick="switchTab('notifs')">🔔 התראות <span id="notif-count-badge" class="notif-badge hidden">0</span></button>
                <button type="button" id="btn-tab-admin" class="tab-btn hidden" onclick="switchTab('admin')">⚙️ תפריט מנהל</button>
            </div>

            <div id="tab-calendar" class="tab-content">
                <div class="card" id="calendar-container"></div>
            </div>

            <div id="tab-notifs" class="tab-content hidden">
                <div class="card" id="notifs-container"></div>
            </div>

            <div id="tab-admin" class="tab-content hidden">
                <div class="card">
                    <h3 style="color:var(--accent-gold); margin-bottom:10px;">1. ניהול סניפים ומנהלי סניפים</h3>
                    <form id="add-branch-form">
                        <input type="hidden" id="edit-branch-id">
                        <input type="text" id="new-branch-name" placeholder="שם הסניף (למשל: סניף אשדוד)" required>
                        <input type="text" id="new-branch-manager" placeholder="שם מנהל הסניף (חובה)" required>
                        <input type="tel" id="new-branch-phone" placeholder="טלפון מנהל הסניף (חובה)" required>
                        <label style="font-size:0.85rem; color:var(--text-muted);">בחר צבע מייצג לסניף ביומן:</label>
                        <input type="color" id="new-branch-color" value="#d4af37" style="height:40px; padding:2px; cursor:pointer;">
                        <button type="submit" id="branch-submit-btn">הוסף סניף</button>
                    </form>
                    <div id="branches-list"></div>
                </div>

                <div class="card">
                    <h3 style="color:var(--accent-gold); margin-bottom:10px;">2. ניהול צוות נגנים וזמרים</h3>
                    <form id="add-musician-form">
                        <input type="hidden" id="edit-musician-id">
                        <input type="text" id="musician-name" placeholder="שם מלא (למשל: ישראל ישראלי)" required>
                        <select id="musician-role">
                            <option value="זמר/ת">זמר/ת</option>
                            <option value="קלידים">קלידים</option>
                            <option value="בוזוקי">בוזוקי</option>
                            <option value="מנהל סניף">מנהל סניף</option>
                        </select>
                        <input type="email" id="musician-email" placeholder="אימייל (למשל: test@gmail.com)" required>
                        <input type="tel" id="musician-phone" placeholder="מספר טלפון (למשל: 050-1234567)" required>
                        <button type="submit" id="musician-submit-btn">הוסף איש צוות</button>
                    </form>
                    <div id="musicians-list"></div>
                </div>
            </div>

            <div id="event-modal" class="card hidden" style="position:fixed; top:5%; left:5%; right:5%; bottom:5%; z-index:1000; overflow-y:auto; border:2px solid var(--accent-gold);">
                <h3 id="modal-date-title" style="color:var(--accent-gold); margin-bottom:10px;"></h3>
                
                <form id="save-event-form">
                    <input type="hidden" id="event-date-input">
                    <label>שעת הופעה:</label>
                    <input type="time" id="event-time-input" required value="20:00">

                    <label style="font-weight:bold; display:block; margin-top:10px;">שיבוץ נגנים וזמרים להופעה זו (לכל היותר 1 מכל תפקיד):</label>
                    <div id="musicians-roster" class="roster-grid"></div>

                    <button type="submit" style="margin-top:15px;">שמור הופעה ושיבוץ צוות</button>
                </form>

                <button type="button" class="btn-secondary" onclick="closeModal()" style="margin-top:10px;">סגור</button>

                <hr style="margin:15px 0; border-color:#444;">
                <h4>הופעות קיימות ביום זה:</h4>
                <div id="existing-day-events"></div>
            </div>

        </div>

    </div>

</body>
</html>
