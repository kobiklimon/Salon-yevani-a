<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>סלון יווני - ניהול הופעות וסניפים</title>
    
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogI9eo15DXqSAtINeh15z115Ug16nXldeg15kiLAogICJzaG9ydF9uYW1lIjogI9eo15DXqSIsCiAgInN0YXJ0X3VybCI6ICIuIiwKICAiZGlzcGxheSI6ICJzdGFuZGFsb25lIiwKICAiYmFja2dyb3VuZF9jb2xvciI6ICIjMWExYTFhIiwKICAidGhlbWVfY29sb3IiOiAiI2Q0YWYzNyIKfQ==">
    <meta name="theme-color" content="#d4af37">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #d4af37;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --danger: #e53935;
            --success: #43a047;
            --border-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); direction: rtl; padding-bottom: 40px; }

        header { background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%); padding: 15px; text-align: center; border-bottom: 2px solid var(--accent-gold); position: sticky; top: 0; z-index: 100; }
        header h1 { color: var(--accent-gold); font-size: 1.3rem; }

        .container { max-width: 700px; margin: 0 auto; padding: 12px; }

        .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        
        input, select, button, textarea { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background-color: #2a2a2a; color: #fff; font-size: 0.95rem; }
        button { background-color: var(--accent-gold); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-secondary { background-color: #444; color: white; }

        .hidden { display: none !important; }

        /* Calendar Styles */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .cal-day-name { font-weight: bold; font-size: 0.8rem; color: var(--accent-gold); padding: 4px; }
        .cal-cell { background: #252525; border-radius: 6px; min-height: 60px; padding: 4px; font-size: 0.8rem; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; border: 1px solid transparent; }
        .cal-cell:hover { border-color: var(--accent-gold); }
        .cal-cell.empty { background: transparent; cursor: default; }
        .cal-cell .day-num { font-weight: bold; text-align: right; }
        .cal-event-badge { background: var(--accent-gold); color: #000; border-radius: 4px; font-size: 0.65rem; padding: 2px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }

        /* Roster Checkboxes */
        .roster-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 10px 0; }
        .roster-item { display: flex; align-items: center; gap: 10px; background: #2a2a2a; padding: 10px; border-radius: 6px; }
        .roster-item input { width: auto; margin: 0; transform: scale(1.3); }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; background: #333; color: var(--accent-gold); margin-right: 4px; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCis-H1d8436iH6vBkNfGWoy3ekkIDSflU",
            authDomain: "salon-yevani-a.firebaseapp.com",
            projectId: "salon-yevani-a",
            storageBucket: "salon-yevani-a.firebasestorage.app",
            messagingSenderId: "659584308438",
            appId: "1:659584308438:web:7ee8f7bc62e1b2132c6577"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentBranchId = '';
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let allMusicians = [];
        let monthEvents = [];

        // App Navigation
        window.switchTab = (tabName) => {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            
            document.getElementById(`btn-tab-${tabName}`).classList.add('active');
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            if(tabName === 'calendar') loadCalendarView();
            if(tabName === 'admin') loadAdminData();
        };

        // Auth Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('user-email').textContent = user.email;
                loadBranchesSelect();
                loadMusiciansData();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
            } catch (err) { alert("שגיאה בהתחברות: " + err.message); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        // Load Branches Select Dropdown
        async function loadBranchesSelect() {
            const select = document.getElementById('branch-select');
            select.innerHTML = '<option value="">-- בחר סניף להצגת יומן --</option>';
            const snap = await getDocs(collection(db, "branches"));
            snap.forEach(d => {
                select.innerHTML += `<option value="${d.id}">${d.data().name}</option>`;
            });
        }

        // Add Branch (Admin)
        document.getElementById('add-branch-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('new-branch-name').value;
            await addDoc(collection(db, "branches"), { name });
            document.getElementById('new-branch-name').value = '';
            alert("סניף נוסף בהצלחה!");
            loadBranchesSelect();
            loadAdminData();
        });

        // Add Musician (Admin)
        document.getElementById('add-musician-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('musician-name').value;
            const role = document.getElementById('musician-role').value;
            await addDoc(collection(db, "musicians"), { name, role });
            document.getElementById('musician-name').value = '';
            alert("איש צוות נוסף בהצלחה!");
            loadMusiciansData();
            loadAdminData();
        });

        async function loadMusiciansData() {
            const snap = await getDocs(collection(db, "musicians"));
            allMusicians = [];
            snap.forEach(d => allMusicians.push({ id: d.id, ...d.data() }));
        }

        // Admin Data Render
        async function loadAdminData() {
            // Branches list
            const bSnap = await getDocs(collection(db, "branches"));
            const bList = document.getElementById('branches-list');
            bList.innerHTML = '<h4>סניפים קיימים:</h4>';
            bSnap.forEach(d => {
                bList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0; background:#2a2a2a; padding:8px; border-radius:6px;">
                    <span>📍 ${d.data().name}</span>
                    <button class="btn-danger" style="width:auto; padding:4px 10px; margin:0;" onclick="deleteItem('branches', '${d.id}')">מחק</button>
                </div>`;
            });

            // Musicians list
            const mList = document.getElementById('musicians-list');
            mList.innerHTML = '<h4 style="margin-top:12px;">צוות נגנים וזמרים:</h4>';
            allMusicians.forEach(m => {
                mList.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin:8px 0; background:#2a2a2a; padding:8px; border-radius:6px;">
                    <span>🎵 ${m.name} <span class="badge">${m.role}</span></span>
                    <button class="btn-danger" style="width:auto; padding:4px 10px; margin:0;" onclick="deleteItem('musicians', '${m.id}')">מחק</button>
                </div>`;
            });
        }

        window.deleteItem = async (col, id) => {
            if(confirm("למחוק פריט זה?")) {
                await deleteDoc(doc(db, col, id));
                await loadMusiciansData();
                await loadAdminData();
                await loadBranchesSelect();
                if(currentBranchId) loadCalendarView();
            }
        };

        // Branch Selection Event
        window.onBranchChanged = () => {
            currentBranchId = document.getElementById('branch-select').value;
            loadCalendarView();
        };

        window.changeMonth = (dir) => {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            loadCalendarView();
        };

        async function loadCalendarView() {
            const container = document.getElementById('calendar-container');
            if (!currentBranchId) {
                container.classList.add('hidden');
                document.getElementById('no-branch-msg').classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            document.getElementById('no-branch-msg').classList.add('hidden');

            const monthNames = ["ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני", "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"];
            document.getElementById('cal-month-title').textContent = `${monthNames[currentMonth]}${currentYear}`;

            // Load Events for Branch
            const q = query(collection(db, "events"), where("branchId", "==", currentBranchId));
            const snap = await getDocs(q);
            monthEvents = [];
            snap.forEach(d => monthEvents.push({ id: d.id, ...d.data() }));

            // Render Grid
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            let gridHTML = `
                <div class="cal-day-name">א'</div><div class="cal-day-name">ב'</div>
                <div class="cal-day-name">ג'</div><div class="cal-day-name">ד'</div>
                <div class="cal-day-name">ה'</div><div class="cal-day-name">ו'</div>
                <div class="cal-day-name">ש'</div>
            `;

            for (let i = 0; i < firstDay; i++) {
                gridHTML += `<div class="cal-cell empty"></div>`;
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = monthEvents.filter(e => e.date === dateStr);

                let eventBadges = dayEvents.map(e => `<div class="cal-event-badge">${e.time} הופעה</div>`).join('');

                gridHTML += `
                    <div class="cal-cell" onclick="openDayModal('${dateStr}')">
                        <div class="day-num">${day}</div>
                        <div>${eventBadges}</div>
                    </div>
                `;
            }

            document.getElementById('calendar-grid').innerHTML = gridHTML;
        }

        // Modal / Event Creation & Shift Roster
        window.openDayModal = (dateStr) => {
            document.getElementById('event-date-input').value = dateStr;
            document.getElementById('modal-date-title').textContent = `שיבוץ הופעה לתאריך: ${dateStr}`;
            
            // Build Musician Roster Checkboxes
            const rosterContainer = document.getElementById('musicians-roster');
            rosterContainer.innerHTML = '';
            if (allMusicians.length === 0) {
                rosterContainer.innerHTML = '<p style="color:var(--text-muted);">אין נגנים/זמרים במערכת. הגדר אותם בלשונית "תפריט מנהל".</p>';
            } else {
                allMusicians.forEach(m => {
                    rosterContainer.innerHTML += `
                        <div class="roster-item">
                            <input type="checkbox" id="m-${m.id}" value="${m.name} (${m.role})">
                            <label for="m-${m.id}" style="cursor:pointer; width:100\%;">${m.name} <span class="badge">${m.role}</span></label>
                        </div>
                    `;
                });
            }

            // Show existing events on this day
            renderExistingDayEvents(dateStr);

            document.getElementById('event-modal').classList.remove('hidden');
        };

        function renderExistingDayEvents(dateStr) {
            const existingList = document.getElementById('existing-day-events');
            const dayEvents = monthEvents.filter(e => e.date === dateStr);
            if(dayEvents.length === 0) {
                existingList.innerHTML = '<p style="color:var(--text-muted); font-size:0.85rem;">אין הופעות רשומות ביום זה.</p>';
            } else {
                existingList.innerHTML = dayEvents.map(e => `
                    <div style="background:#2a2a2a; padding:10px; margin-top:8px; border-radius:6px; font-size:0.85rem; border-right:3px solid var(--accent-gold);">
                        <strong>🕒 שעה: ${e.time}</strong><br>
                        👥 <strong>צוות משובץ:</strong><br> ${e.assignedStaff && e.assignedStaff.length ?
